<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>/plug_pc_cycle: from Telegram to a PC that powers on after a power cycle</title>
  <rect width="980" height="430" rx="18" fill="#ffffff"/>

  <!-- Phone -->
  <rect x="30" y="60" width="150" height="250" rx="22" fill="#f4f6f8" stroke="#4a5560" stroke-width="3"/>
  <rect x="45" y="90" width="120" height="190" rx="6" fill="#ffffff" stroke="#c6ccd2"/>
  <rect x="58" y="110" width="94" height="34" rx="10" fill="#d9f2b4"/>
  <text x="105" y="132" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#1c2b0a">/plug_pc_cycle</text>
  <rect x="58" y="160" width="94" height="58" rx="10" fill="#eef1f4"/>
  <text x="105" y="180" text-anchor="middle" font-size="10.5" fill="#333">1 pc: OFF,</text>
  <text x="105" y="194" text-anchor="middle" font-size="10.5" fill="#333">back on in 60 s…</text>
  <text x="105" y="208" text-anchor="middle" font-size="10.5" fill="#333">ON · 48 W ✓</text>
  <text x="105" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Your phone</text>
  <text x="105" y="354" text-anchor="middle" font-size="12" fill="#555">Telegram</text>

  <line x1="190" y1="185" x2="290" y2="185" stroke="#4a5560" stroke-width="3"/>
  <text x="240" y="172" text-anchor="middle" font-size="12" fill="#555">internet</text>

  <!-- Shield -->
  <rect x="300" y="70" width="230" height="230" rx="14" fill="#f4f6f8" stroke="#4a5560" stroke-width="3"/>
  <text x="415" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#222">NVIDIA Shield</text>
  <rect x="320" y="115" width="190" height="40" rx="8" fill="#ffffff" stroke="#c6ccd2"/>
  <text x="415" y="140" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#333">shield-bot (Termux)</text>
  <line x1="415" y1="155" x2="415" y2="175" stroke="#4a5560" stroke-width="2"/>
  <rect x="320" y="178" width="190" height="40" rx="8" fill="#ffffff" stroke="#76b900" stroke-width="2"/>
  <text x="415" y="203" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#333">commands/plug</text>
  <rect x="320" y="238" width="190" height="44" rx="8" fill="#fff8e6" stroke="#e0b44a"/>
  <text x="415" y="256" text-anchor="middle" font-size="11.5" font-family="Menlo, monospace" fill="#5a4410">.secrets/plugs.conf</text>
  <text x="415" y="272" text-anchor="middle" font-size="11.5" font-family="Menlo, monospace" fill="#5a4410">1 pc 192.168.1.50 60</text>
  <line x1="415" y1="236" x2="415" y2="221" stroke="#e0b44a" stroke-width="2" stroke-dasharray="4 3"/>

  <line x1="540" y1="198" x2="640" y2="198" stroke="#4a5560" stroke-width="3"/>
  <text x="590" y="172" text-anchor="middle" font-size="12" fill="#555">home Wi-Fi</text>
  <text x="590" y="187" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#555">Switch.Set</text>
  <text x="590" y="222" text-anchor="middle" font-size="11" font-family="Menlo, monospace" fill="#555">toggle_after=60</text>

  <!-- Shelly plug -->
  <rect x="650" y="140" width="110" height="110" rx="26" fill="#f4f6f8" stroke="#4a5560" stroke-width="3"/>
  <circle cx="687" cy="195" r="9" fill="#4a5560"/>
  <circle cx="723" cy="195" r="9" fill="#4a5560"/>
  <text x="705" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Shelly plug</text>
  <!-- timing -->
  <text x="705" y="300" text-anchor="middle" font-size="11" fill="#555">ON</text>
  <polyline points="652,322 672,322 672,342 738,342 738,322 758,322" fill="none" stroke="#76b900" stroke-width="3"/>
  <text x="705" y="360" text-anchor="middle" font-size="11" fill="#555">OFF 60 s → ON</text>

  <line x1="765" y1="195" x2="830" y2="195" stroke="#4a5560" stroke-width="3"/>
  <text x="797" y="182" text-anchor="middle" font-size="12" fill="#555">power</text>

  <!-- PC -->
  <rect x="840" y="100" width="110" height="190" rx="10" fill="#f4f6f8" stroke="#4a5560" stroke-width="3"/>
  <circle cx="895" cy="135" r="12" fill="none" stroke="#76b900" stroke-width="3"/>
  <line x1="895" y1="121" x2="895" y2="134" stroke="#76b900" stroke-width="3"/>
  <rect x="855" y="170" width="80" height="8" rx="3" fill="#c6ccd2"/>
  <rect x="855" y="186" width="80" height="8" rx="3" fill="#c6ccd2"/>
  <text x="895" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#222">PC boots</text>
  <text x="895" y="335" text-anchor="middle" font-size="11" fill="#555">BIOS: Restore on</text>
  <text x="895" y="350" text-anchor="middle" font-size="11" fill="#555">AC power loss =</text>
  <text x="895" y="365" text-anchor="middle" font-size="11" fill="#555">Power On</text>

  <polygon points="292,185 280,178 280,192" fill="#4a5560"/>
  <polygon points="415,177 409,167 421,167" fill="#4a5560"/>
  <polygon points="642,198 630,191 630,205" fill="#4a5560"/>
  <polygon points="832,195 820,188 820,202" fill="#4a5560"/>

  <text x="490" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#222">/plug_pc_cycle: turn a PC on remotely</text>
  <text x="490" y="405" text-anchor="middle" font-size="12" fill="#666">The plug's own timer switches power back on, so the off time is exact even if Wi-Fi is slow.</text>
</svg>
