<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121418"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="720" y2="0">
      <stop offset="0" stop-color="#76b900" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8fdc12"/>
      <stop offset="0.75" stop-color="#8fdc12"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- floor shadow -->
  <ellipse cx="512" cy="640" rx="290" ry="46" fill="#000" opacity="0.55" filter="url(#shadow)"/>

  <!-- angular streaming box: top face and front faces -->
  <polygon points="250,470 470,360 790,430 560,555" fill="url(#top)"/>
  <polygon points="250,470 560,555 560,605 250,515" fill="url(#side)"/>
  <polygon points="560,555 790,430 790,478 560,605" fill="#0a0c0e"/>
  <!-- facet lines on the top face -->
  <polyline points="360,415 675,492" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5" fill="none"/>
  <polyline points="470,360 560,555" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4" fill="none"/>

  <!-- green light strip with glow, along the top-face diagonal -->
  <line x1="300" y1="455" x2="720" y2="455" stroke="url(#glow)" stroke-width="26" filter="url(#blur)"
        transform="rotate(14 510 455)"/>
  <line x1="300" y1="455" x2="720" y2="455" stroke="url(#glow)" stroke-width="9" stroke-linecap="round"
        transform="rotate(14 510 455)"/>

  <!-- terminal badge -->
  <rect x="560" y="640" width="270" height="190" rx="38" fill="#0d1014" stroke="#76b900" stroke-width="8"/>
  <path d="M612 700 L668 735 L612 770" fill="none" stroke="#8fdc12" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="690" y1="775" x2="770" y2="775" stroke="#8fdc12" stroke-width="18" stroke-linecap="round"/>
</svg>
